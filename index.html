<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Seat Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14171f;--mut:#6b7280;--ac:#2563eb;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c25;--tx:#eef0f5;--mut:#9aa3b2;--bd:#2a3040}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c25;--tx:#eef0f5;--mut:#9aa3b2;--bd:#2a3040}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:20px}
.wrap{max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 16px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px;direction:ltr;text-align:left}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.qr{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qr div.box{background:#fff;padding:10px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ok{color:#16a34a;font-weight:700;margin-top:16px}
.big{font-size:26px;font-weight:700;margin:4px 0 14px}
.k{font-size:13px;color:var(--mut)}
@media print{.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var app=document.getElementById('app');
var p=new URLSearchParams(location.search);
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function linkFor(n,s){var b=document.getElementById('base');var v=b?b.value.trim():'';if(!v)return 'الاسم: '+n+'\nالمقعد: '+s;return v.split('?')[0]+'?n='+encodeURIComponent(n)+'&s='+encodeURIComponent(s)}
function makeQR(n,s){
  var wrap=document.createElement('div');wrap.className='qr';
  var box=document.createElement('div');box.className='box';wrap.appendChild(box);
  new QRCode(box,{text:linkFor(n,s),width:240,height:240,correctLevel:QRCode.CorrectLevel.L});
  var t=document.createElement('div');t.innerHTML='<b>'+esc(n)+'</b><div class="k">Seat: '+esc(s)+'</div>';wrap.appendChild(t);
  var lk=document.createElement('div');lk.className='k noprint';lk.style.cssText='word-break:break-all;font-size:11px;white-space:pre-line';lk.textContent=linkFor(n,s);wrap.appendChild(lk);
  var b=document.createElement('button');b.className='sec noprint';b.textContent='تحميل QR';
  b.onclick=function(){var c=box.querySelector('canvas');var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=(n+'-'+s).replace(/\s+/g,'_')+'.png';a.click()};
  wrap.appendChild(b);return wrap;
}
if(p.get('n')&&p.get('s')){
  app.innerHTML='<div class="card" style="text-align:center"><div class="k">مرحبًا بك</div><div class="k" style="margin-top:14px">الاسم</div><div class="big">'+esc(p.get('n'))+'</div><div class="k">رقم المقعد</div><div class="big">'+esc(p.get('s'))+'</div><div class="ok">✓ تم التحقق من بيانات المقعد</div></div>';
}else{
  app.innerHTML='<div class="card noprint"><h1>QR Seat Generator</h1><label>الاسم</label><input id="n" placeholder="أحمد محمد"><label>رقم المقعد</label><input id="s" placeholder="A-27" dir="ltr"><button id="g">إنشاء QR</button><button id="r" class="sec">ريست / بداية جديدة</button></div>'+
  '<div class="card" id="out" style="display:none"><div class="grid" id="grid"></div></div>';
  var grid=document.getElementById('grid'),out=document.getElementById('out');
  document.getElementById('g').onclick=function(){
    var n=document.getElementById('n').value.trim(),s=document.getElementById('s').value.trim();
    if(!n||!s)return;grid.innerHTML='';grid.appendChild(makeQR(n,s));out.style.display='block';
  };
  document.getElementById('r').onclick=function(){
    document.getElementById('n').value='';document.getElementById('s').value='';
    grid.innerHTML='';out.style.display='none';
    document.getElementById('n').focus();
  };
}
</script>
</body>
</html>
